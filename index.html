
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediTrack - Medicine Reminder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a class="brand" href="#" aria-label="MediTrack home">PillPlus</a>

        <div class="nav-links">
            <a class="active" href="#dashboard">Dashboard</a>
            <a href="#add-medicine">Add Medicine</a>
            <a href="#schedule">Medicine Schedule</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="dashboard">

        <header>
            <h1>My Dashboard</h1>
            <p>Welcome! Manage your daily medicines.</p>
        </header>

        <!-- Summary Cards -->
        <section class="cards">

            <div class="card">
                <h3>Total Medicines</h3>
                <h2 id="totalMedicines">0</h2>
            </div>

            <div class="card">
                <h3>Medicines Taken</h3>
                <h2 id="takenMedicines">0</h2>
            </div>

            <div class="card">
                <h3>Remaining Tablets</h3>
                <h2 id="totalStock">0</h2>
            </div>

        </section>

        <!-- Add Medicine Form -->
        <section class="section" id="add-medicine">

            <h2>Add New Medicine</h2>

            <form id="medicineForm">

                <input
                    type="text"
                    id="medicineName"
                    placeholder="Medicine Name"
                    required
                >

                <input
                    type="text"
                    id="dosage"
                    placeholder="Dosage (e.g. 500mg)"
                    required
                >

                <select id="timing" required>
                    <option value="">Select Timing</option>
                    <option value="Morning">Morning</option>
                    <option value="Afternoon">Afternoon</option>
                    <option value="Night">Night</option>
                </select>

                <select id="meal" required>
                    <option value="">Meal Instruction</option>
                    <option value="Before Food">Before Food</option>
                    <option value="After Food">After Food</option>
                </select>

                <input
                    type="number"
                    id="stock"
                    placeholder="Number of Tablets"
                    min="1"
                    required
                >

                <button type="submit">Add Medicine</button>

            </form>

        </section>

        <!-- Medicine Schedule -->
        <section class="section" id="schedule">

            <h2>Today's Medicine Schedule</h2>

            <div id="medicineList">
                <p>No medicines added yet.</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
